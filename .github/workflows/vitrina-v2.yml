name: Vitrina V2 · QA gratuita
on:
  pull_request:
    paths:
      - 'src/home-vitrina.js'
      - 'src/ui.js'
      - 'src/app.js'
      - 'src/styles.css'
      - 'src/index.html'
      - 'scripts/visual-qa-fixes-browser.mjs'
      - 'src/reader.js'
      - 'src/prelaunch-access.js'
      - 'scripts/prelaunch-access-check.mjs'
      - 'scripts/home-vitrina-v2-check.mjs'
      - 'scripts/home-without-ticker-check.mjs'
      - 'scripts/visual-phase3-check.mjs'
      - 'scripts/visual-phase4-check.mjs'
      - 'scripts/visual-phase5-check.mjs'
      - 'scripts/visual-phase4-browser.mjs'
      - 'scripts/visual-phase5-browser.mjs'
      - 'scripts/phase6-public-check.mjs'
      - 'src/reader-a11y.css'
      - 'scripts/home-vitrina-real-cover-check.mjs'
      - '.github/workflows/vitrina-v2.yml'
  push:
    branches:
      - 'feat/vitrina-v2-*'
    paths:
      - 'src/home-vitrina.js'
      - 'src/ui.js'
      - 'src/app.js'
      - 'src/styles.css'
      - 'src/index.html'
      - 'scripts/visual-qa-fixes-browser.mjs'
      - 'src/reader.js'
      - 'src/prelaunch-access.js'
      - 'scripts/prelaunch-access-check.mjs'
      - 'scripts/home-vitrina-v2-check.mjs'
      - 'scripts/home-without-ticker-check.mjs'
      - 'scripts/visual-phase3-check.mjs'
      - 'scripts/visual-phase4-check.mjs'
      - 'scripts/visual-phase5-check.mjs'
      - 'scripts/visual-phase4-browser.mjs'
      - 'scripts/visual-phase5-browser.mjs'
      - 'scripts/phase6-public-check.mjs'
      - 'src/reader-a11y.css'
      - '.github/workflows/vitrina-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    name: Contrato editorial y Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: |
          node --check src/home-vitrina.js
          node --check src/ui.js
          node --check src/reader.js
          node --check src/prelaunch-access.js
          node --check scripts/prelaunch-access-check.mjs
          node --check scripts/home-vitrina-v2-check.mjs
          node --check scripts/home-without-ticker-check.mjs
          node --check scripts/visual-qa-fixes-browser.mjs
          node --check scripts/home-vitrina-real-cover-check.mjs
      - name: Verificar bloqueo de preestrenos y enlaces opacos
        run: node scripts/prelaunch-access-check.mjs
      - name: Validar Ranking y formulario móvil de 320 a 1440 px
        run: node scripts/visual-qa-fixes-browser.mjs
      - name: Comprobar retiro de cinta sin perder contenidos
        run: node scripts/home-without-ticker-check.mjs
      - name: Contratos originales de fases visuales y novedades
        run: |
          node scripts/visual-phase3-check.mjs
          node scripts/visual-phase4-check.mjs
          node scripts/visual-phase5-check.mjs
          node scripts/phase6-public-check.mjs
      - name: Accesibilidad y componentes responsive sin cinta (Chromium)
        run: |
          node scripts/visual-phase4-browser.mjs
          node scripts/visual-phase5-browser.mjs
      - name: Validar cinco tamaños en navegador
        run: node scripts/home-vitrina-v2-check.mjs
      - name: Validar portadas reales públicas y capturas
        run: node scripts/home-vitrina-real-cover-check.mjs
      - name: Guardar capturas para revisión visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrina-v2-capturas-reales
          path: qa-capturas/vitrina-portadas-reales-*.png
          if-no-files-found: ignore
          retention-days: 1
