name: SEG-02 · Integración Supabase Auth y REST local

on:
  push:
    branches:
      - test/preferencias-fase4-qa-integral-20261021
    paths:
      - '.github/workflows/seg02-supabase-integration.yml'
      - 'scripts/seg02-make-supabase-fixture.mjs'
      - 'scripts/seg02-supabase-http-check.mjs'
      - 'supabase/tests/fixtures/seg02_postgres_fixture.sql'
      - 'supabase/tests/seg02_profile_privacy.sql'
      - 'supabase/tests/seg02_rls_integration.sql'
      - 'supabase/migrations/20261022055000_secure_reader_profiles.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seg02-supabase-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-rest:
    name: Auth GoTrue + PostgREST + RLS + RPC (datos ficticios)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias del proyecto
        run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Crear entorno Supabase completamente local
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/obi-seg02-local"
          mkdir -p "$work"
          cd "$work"
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('supabase/config.toml')
          content=path.read_text()
          content,count=re.subn(r'(?m)^enable_anonymous_sign_ins\s*=\s*(?:true|false)', 'enable_anonymous_sign_ins = true',content)
          if not count: content=content.replace('[auth]\n','[auth]\nenable_anonymous_sign_ins = true\n',1)
          content,count=re.subn(r'(?m)^enable_confirmations\s*=\s*(?:true|false)', 'enable_confirmations = false',content)
          if not count: content=content.replace('[auth.email]\n','[auth.email]\nenable_confirmations = false\n',1)
          path.write_text(content)
          PY
          echo 'Inicializando servicios locales Auth, PostgREST, Kong y PostgreSQL (sin nube)'
          supabase start -x studio,realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/seg02-cli-start.log" 2>&1 || {
            tail -n 85 "$RUNNER_TEMP/seg02-cli-start.log"
            exit 1
          }
          supabase status -o env > "$RUNNER_TEMP/seg02-cli-env"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP']+'/seg02-cli-env').read_text()
          names={'API_URL':'OBI_QA_API_URL','ANON_KEY':'OBI_QA_ANON_KEY','SERVICE_ROLE_KEY':'OBI_QA_SERVICE_KEY'}
          data={}
          for line in src.splitlines():
            match=re.match(r'^([A-Z_]+)\s*=\s*"?([^"\n]*)"?$',line.strip())
            if match: data[match.group(1)]=match.group(2)
          missing=[key for key in names if not data.get(key)]
          if missing: raise SystemExit('Missing local Supabase status variables: '+','.join(missing))
          if not re.fullmatch(r'https?://(127\.0\.0\.1|localhost):\d+/?',data['API_URL']):
            raise SystemExit('Refusing non-loopback API URL')
          with open(os.environ['GITHUB_ENV'],'a') as out:
            for name,target in names.items():
              if name!='API_URL':print('::add-mask::'+data[name])
              print(target+'='+data[name],file=out)
          print('Supabase local iniciado y credenciales temporales preparadas')
          PY
          cd "$GITHUB_WORKSPACE"
      - name: Aplicar SQL completo y verificar ACL en Auth/PostgREST local
        shell: bash
        run: |
          set -euo pipefail
          db="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ {print $1;exit}')"
          if [ -z "$db" ]; then echo 'No hay contenedor de base local de Supabase' >&2; exit 1; fi
          node scripts/seg02-make-supabase-fixture.mjs "$RUNNER_TEMP/seg02-local-fixture.sql"
          psql_local() {
            docker exec -i -e PGPASSWORD=postgres "$db" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$1"
          }
          echo '1/4 · Esquema sintético en la pila completa de Supabase'
          psql_local "$RUNNER_TEMP/seg02-local-fixture.sql" > "$RUNNER_TEMP/seg02-fixture.log"
          echo '2/4 · Migración completa y creación de las RPC'
          psql_local supabase/migrations/20261022055000_secure_reader_profiles.sql > "$RUNNER_TEMP/seg02-migrate.log"
          echo '3/4 · Privilegios y visibilidad'
          psql_local supabase/tests/seg02_profile_privacy.sql > "$RUNNER_TEMP/seg02-privileges.log"
          echo '4/4 · A/B RLS y SQL regresión'
          psql_local supabase/tests/seg02_rls_integration.sql > "$RUNNER_TEMP/seg02-rls.log"
          echo 'Migración SQL y pruebas de permisos ejecutadas con Supabase local'
      - name: Probar dos cuentas reales locales y API HTTP
        run: node scripts/seg02-supabase-http-check.mjs
      - name: Eliminar contenedores y credenciales locales
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/obi-seg02-local" || exit 0
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/seg02-cli-env"
