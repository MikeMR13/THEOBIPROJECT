name: Diagnostico tiempos HTTP produccion (solo lectura)
on:
  push:
    branches: [diagnostic/prod-ttfb-20261026]
    paths:
      - '.github/workflows/production-ttfb-diagnostic.yml'
  pull_request:
    paths:
      - '.github/workflows/production-ttfb-diagnostic.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Comparar HTML dinamico y estatico
        env:
          ORIGIN: https://elobidellector.com
        shell: bash
        run: |
          set -euo pipefail
          echo 'Prueba de solo lectura desde GitHub-hosted runner; no se publican cambios ni se llama a correo.'
          for i in 1 2 3; do
            for path in / /index.html /catalogo; do
              echo "Muestra=$i ruta=$path"
              curl --max-time 14 -sS --compressed -L -o /tmp/obi-http-body -D /tmp/obi-http-headers \
                -w 'status=%{http_code} dns_ms=%{time_namelookup} tcp_ms=%{time_connect} tls_ms=%{time_appconnect} ttfb_ms=%{time_starttransfer} total_s=%{time_total} bytes=%{size_download}\n' \
                "$ORIGIN$path" | tee /tmp/obi-metric
              grep -iE '^(cache-control|x-vercel-cache|x-vercel-id|content-type|age):' /tmp/obi-http-headers | tr -d '\r' || :
              if ! grep -q 'status=200' /tmp/obi-metric; then
                echo 'WARN: no se obtuvo HTTP 200'; fi
            done
          done

      - name: Identificar proteccion 403 sin autenticar
        shell: bash
        run: |
          set -euo pipefail
          for host in elobidellector.com www.elobidellector.com theobiproject.vercel.app; do
            echo "Host de diagnostico: $host"
            curl -LsS --max-time 14 -o /tmp/obi-403-body -D /tmp/obi-403-headers \
              -w 'http=%{http_code} ttfb_s=%{time_starttransfer} redirect=%{num_redirects}\n' "https://$host/index.html"
            grep -iE '^(server|cf-ray|cf-mitigated|x-vercel|x-robots-tag|content-type|location):' /tmp/obi-403-headers | tr -d '\r' || :
            if grep -qi 'cloudflare\|checking your browser\|just a moment' /tmp/obi-403-body; then echo 'pagina indica Cloudflare/bot challenge'; fi
            if grep -qi 'vercel\|authentication required\|deployment protection' /tmp/obi-403-body; then echo 'pagina menciona Vercel'; fi
            if grep -qi 'access denied\|forbidden\|error' /tmp/obi-403-body; then echo 'pagina informa acceso denegado/error'; fi
          done
