name: Validación visual de correcciones · Preview real
on:
  push:
    branches:
      - fix/auditoria-ranking-vitrina-login-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    name: Inicio, Ranking y Acceso con Chromium real
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      AUDIT_PREVIEW_URL: https://theobiproject-frlsx4j3p-cronica.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright Core sin descargar navegador
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Verificar sintaxis
        run: node --check scripts/visual-fix-preview-check.mjs
      - name: Validar 9 rutas y áreas táctiles del despliegue real
        run: node scripts/visual-fix-preview-check.mjs
      - name: Adjuntar capturas de referencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ranking-inicio-login
          path: qa-capturas/mejoras-auditoria/
          retention-days: 1
          if-no-files-found: ignore
