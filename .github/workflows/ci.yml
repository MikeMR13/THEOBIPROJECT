name: ci
on: [push, pull_request]
# Un único CI por rama: evita que 3 PRs del mismo SHA ejecuten Chromium
# simultáneamente y compitan por CPU. Nunca silencia aserciones funcionales.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Configuración ficticia de CI; jamás usa la base de producción.
      OBI_SUPABASE_URL: https://ci-example.supabase.co
      OBI_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Vercel compila con Node 24: probar la misma versión en QA.
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - name: Validar TOML de Supabase
        run: python3 -c "import tomllib; tomllib.load(open('supabase/config.toml','rb'))"
      - run: npm run check && npm run quality-gates && npm run build && npm run verify && npm run optimize-check && npm run db-phase2-check && npm run phase3-check && npm run phase4-check && npm run studio-functional-check && npm run studio-fields-check && npm run integration-check
      - name: Biblioteca y temporadas · estados, fechas y acciones (sin backend)
        run: node scripts/season-library-audit-check.mjs
      - name: Editor Productividad · Entrega 2 (sin backend)
        run: node scripts/editor-productividad-entrega2-check.mjs
      - name: Importación · proteger guard_publish de 42703 (sin backend)
        run: node scripts/import-guard-42703-check.mjs
      - name: Editor colaboración · Entrega 3 (sin backend)
        run: node scripts/editor-colaboracion-entrega3-check.mjs
      - name: Editor colaboración · Entrega 3 (Chromium sin backend)
        run: node scripts/editor-colaboracion-entrega3-browser.mjs
      - run: npm run studio-browser-check
      - name: SEO — Noindex sin texto vertical ni desbordamiento (Chromium)
        run: node scripts/seo-noindex-layout-browser.mjs
      - name: Obras — portada principal en Datos, multimedia y permisos (sin backend)
        run: node scripts/series-cover-editor-check.mjs
      - name: Importador EPUB/DOCX/PDF — numeración, multimedia y seguridad de portada
        run: node scripts/importer-safety-check.mjs
      - name: Editor Fase 1 — calidad editorial, alt y regresión Chromium (sin backend)
        run: node scripts/editor-phase1-quality-check.mjs
      - name: Editor Fase 2 — móvil, teclado y foco (Chromium aislado)
        run: node scripts/editor-phase2-mobile-browser-check.mjs
      - name: Editor Fase 3 — sugerencias, comparación y permisos (sin backend)
        run: node scripts/editor-phase3-collaboration-check.mjs
      - name: Editor Fase 4 — aprobación de versión, publicación segura y tablero
        run: node scripts/editor-phase4-approval-check.mjs
      - name: Editor Fase 5 — asistente de escritura y glosario (Chromium aislado)
        run: node scripts/editor-phase5-writing-check.mjs
      - name: Estudio · parche barra sticky con scroll de 3000px (1470/390/320, Chromium)
        run: node scripts/editor-visual-sticky-browser.mjs
      - name: Editor visual · entrega 1 títulos, vista previa fija y sincronización (Chromium)
        run: node scripts/editor-visual-entrega1-browser.mjs
      - name: Fase 1 móvil — numeración editorial universal, secciones y CTA
        run: node scripts/public-editorial-phase1-check.mjs
      - name: Índice editorial opcional — prefijos, títulos originales y persistencia
        run: node scripts/chapter-title-import-optin-check.mjs
      - name: Importador — instalar analizadores fijados para prueba de navegador (sin guardar dependencias)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jszip@3.10.1 mammoth@1.8.0 pdfjs-dist@4.4.168
      - name: Importador EPUB/DOCX/PDF — archivos de muestra en Chromium, sin backend
        run: node scripts/importer-formats-browser.mjs
      - name: Descargas sin conexión — Obras, Biblioteca, volúmenes y capítulos (sin backend)
        run: node scripts/offline-buttons-check.mjs
      - name: Lector Fase 4 — lectura continua y TTS sin condiciones de carrera
        run: node scripts/reader-phase4-continuity-check.mjs
      - name: Calidad lector, imágenes e Inicio/Catálogo (sin backend)
        run: node scripts/reader-quality-phase134-check.mjs
      - name: Cinco fases auditoría — contratos sin backend ni servicios de pago
        run: node scripts/auditoria-cinco-fases-check.mjs
      - name: Studio — regresiones de auditoría de secciones (sin backend)
        run: node scripts/studio-auditoria-resto-check.mjs
      - name: Obras — filtros, importación, publicación y móvil (sin backend)
        run: node scripts/studio-obras-auditoria-check.mjs
      - name: Lector Fase 4 — navegación rápida, latencia y acceso restringido (Chromium)
        run: node scripts/reader-phase4-integration-browser.mjs
      - name: Lector — barra fija visible con scroll real en escritorio 1440px (Chromium)
        run: OBI_READER_VIEWPORT=desktop node scripts/reader-phase4-integration-browser.mjs
      - name: Difusión — Chromium confirmación multicanal sin envíos externos
        run: npm run diffusion-confirmation-browser-check
      - name: PWA optimizada — presupuesto de caché sin descargas opcionales
        run: node scripts/pwa-cache-budget-check.mjs
      - name: PWA sin conexión — arranque íntegro y descargas sin pérdidas
        run: npm run pwa-offline-check
      - name: PWA sin conexión — lectura local sin espera de red
        run: node scripts/pwa-offline-latency-check.mjs
      - name: PWA sin conexión — Chromium, dos capítulos y sesión guardada
        run: node scripts/pwa-offline-browser-check.mjs
      - name: "Inicio editorial: espaciado de etiquetas, ranking y títulos en 5 tamaños"
        run: npm run home-hero-layout-check
      - name: Evidencia de carrusel — móvil y PC (24 horas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrusel-inicio-responsive-qa
          path: qa-capturas/carrusel-responsive-*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Inicio crítico — ejecutar carrusel real antes del tema de temporada
        run: node --check scripts/home-hero-season-regression.mjs && node scripts/home-hero-season-regression.mjs
      - name: "Inicio mixto: rotación diaria, equipos y novela completa inmediata"
        run: npm run home-featured-check
      - name: "Publicaciones editoriales: volúmenes antes que capítulos"
        run: npm run home-volume-check
      - name: Contratos de accesibilidad y conservación editorial
        run: node scripts/visual-phase5-check.mjs
      - name: Validación de temporadas, temas y preferencias combinadas
        run: node scripts/visual-integration-preferences.mjs
      - name: TTS — paginado por voz, espera, segundo plano y restauración (Chromium)
        run: node scripts/tts-continuity-check.mjs
      - name: Chromium accesible (normal y movimiento reducido)
        run: node scripts/visual-phase5-browser.mjs
      - name: Invitaciones · mostrar únicamente los campos del modo seleccionado
        run: node scripts/invitaciones-visibility-browser.mjs
      - name: Bibliotecario · paginación, navegación y móvil real (Chromium)
        run: node scripts/bibliotecario-browser-check.mjs
      - name: Studio · selección real de relaciones con ratón y toque móvil (Chromium CDP)
        run: node scripts/studio-related-pointer-e2e.mjs
      - name: QA visual responsive (5 anchuras, datos ficticios)
        run: npm run visual-browser-check
      - name: Perfil público de grupos — Chromium responsive y orden de teclado
        run: node scripts/team-profile-browser-check.mjs
      - name: Diálogos Obi — confirmación, cancelación, entrada y teclado (Chromium)
        run: node scripts/obi-dialog-browser-check.mjs
      - name: Mi biblioteca — Chromium, accesibilidad y capturas de escritorio/móvil
        run: OBI_LIBRARY_SCREENSHOTS=1 node scripts/library-browser-check.mjs
      - name: Entrega 2 — Ranking, números editoriales y Apoyar (sin backend)
        run: node scripts/entrega2-lectura-visible-check.mjs
      - name: Guardar capturas de revisión de Mi biblioteca (24 horas)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-qa-escritorio-movil
          path: qa-capturas/biblioteca-*.png
          retention-days: 1
          if-no-files-found: error
      - name: Compatibilidad visual A3/C3/S3 sin backend
        run: node scripts/library-design-compat-check.mjs
      - name: Fase 6.1 QA Inicio y Catálogo (Chromium)
        run: node scripts/phase6-public-check.mjs
      - name: Ficha pública Fases 1–2 — galería, lista y descargas en 5 tamaños
        run: node scripts/series-editorial-phase12-check.mjs
      - name: Ficha pública Fases 3–4 — búsqueda, filtros y accesibilidad móvil
        run: node scripts/series-editorial-phase34-check.mjs
      - name: Fase 2 móvil — Inicio, Catálogo y Studio (Chromium 320/375/390/430)
        run: node scripts/mobile-experience-phase2-browser.mjs
      - name: Fase 3 móvil — presupuesto del build y recursos comprimidos
        run: node scripts/mobile-phase3-perf-budget.mjs
      - name: Fase 3 móvil — navegación accesible y foco en Chromium (320–1024)
        run: node scripts/mobile-phase3-a11y-browser.mjs
      - name: Temporadas y auditoría iPhone — menú, títulos, efectos y movimiento reducido
        run: node --check scripts/season-mobile-visual-regression-browser.mjs && node scripts/season-mobile-visual-regression-browser.mjs
      - name: Guardar comparativa visual de temporada y menú (24 horas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporada-menu-titulos-qa
          path: qa-capturas/temporada-menu-titulos-*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Móvil — índice, botones y cabecera sin solapamientos (Chromium 320–1024)
        run: node scripts/mobile-layout-regression-check.mjs
      - name: Ficha pública — pestañas y descargas separadas (Chromium responsive)
        run: node scripts/series-tabs-mobile-check.mjs
      - name: Compartir ficha — portal visible, móvil y teclado (Chromium)
        run: node scripts/share-browser-check.mjs
      - name: Tipos de sección — Studio, EPUB/PDF, lector, ficha y migración
        run: node scripts/section-types-check.mjs
      - name: Anuncios editoriales — publicación, caducidad y UI móvil sin notificaciones
        run: node scripts/editorial-announcements-check.mjs
      - name: Preferencias fase 1 — aislamiento y borradores recuperables
        run: npm run preferencias-fase1-check
      - name: Preferencias fase 2 — navegación y accesibilidad
        run: npm run preferencias-fase2-check && npm run preferencias-fase2-browser
      - name: Preferencias fase 3 — vista previa de lector, privacidad y avisos
        run: npm run preferencias-fase3-check
      - name: Preferencias fase 4 — sesión simulada, guardado, navegación y responsive
        run: npm run preferencias-fase4-browser
      - name: Fase 6.2 temporadas y preferencias (funciones reales)
        run: node scripts/phase6-seasons-preferences-check.mjs
      - name: Fase 6.3 Studio, permisos y enlaces de borrador
        run: node scripts/phase6-studio-accounts-check.mjs
      - name: Fase 6.4 Lector y predeterminados de equipos
        run: node scripts/phase6-reader-check.mjs
      - name: Lector — estabilidad, caché, apertura y controles táctiles
        run: node scripts/reader-improvements-check.mjs
      - name: Lector Fase 2 — apertura rápida y caché concurrente
        run: node scripts/reader-phase2-speed-check.mjs
      - name: Lector Fase 3 — visual responsive en Chromium, sin backend
        run: node scripts/reader-phase3-visual-browser.mjs
      - name: Fase 6.5 regresión cruzada y sesiones concurrentes
        run: node scripts/phase6-regression-check.mjs
      - name: Estudio Fase 1 — geometría en seis anchuras
        run: npm run studio-visual-phase1-check
      - name: Estudio Fase 2 — formularios, tarjetas, tablas y filtros
        run: npm run studio-visual-phase2-check
      - name: Patreon — selector, casilla y fecha responsive en 12 vistas Chromium
        run: node scripts/patreon-responsive-browser-check.mjs
      - name: Estudio Fase 3 — navegación y módulos complementarios
        run: npm run studio-visual-phase3-check
      - name: Validar compilación Preview aislada
        run: VERCEL_ENV=preview OBI_SUPABASE_URL=https://obi-qa-backend.invalid OBI_SUPABASE_PUBLISHABLE_KEY=sb_publishable_qa_mock_not_connected npm run build && npm run preview-isolation-check
      - name: Fase 7 comprobar artefactos de candidato y backend aislado
        run: node scripts/phase7-release-check.mjs
      - name: Fase 7 validar configuración y módulos previos de la plataforma
        run: node scripts/phase7-platform-compat-check.mjs
      - name: SEG-01 privacidad de perfiles e identidades unificadas
        run: node scripts/privacy-identity-compat-check.mjs
      - name: SEG-02 permisos mínimos, visibilidad y RPC seguros
        run: npm run seguridad-perfiles-check
