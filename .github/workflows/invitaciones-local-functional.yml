name: Invitaciones · QA funcional Supabase local (sin costo de branch)

on:
  push:
    branches: [feat/bibliotecario-invitaciones-20261022]
    paths:
      - ".github/workflows/invitaciones-local-functional.yml"
      - "supabase/tests/fixtures/invitaciones_auth_local.sql"
      - "supabase/migrations/20261022231500_team_invitations_one_time.sql"
      - "scripts/invitaciones-supabase-local-http-check.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invitaciones-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    name: GoTrue Auth + PostgREST + PostgreSQL · datos ficticios
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar cliente Supabase de pruebas
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar instancia Supabase local SIN conexión con producción
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/obi-invitaciones-local"
          mkdir -p "$dir"
          cd "$dir"
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('supabase/config.toml')
          s=f.read_text()
          s,n=re.subn(r'(?m)^enable_confirmations\s*=\s*(?:true|false)', 'enable_confirmations = true',s)
          if not n: s=s.replace('[auth.email]\n','[auth.email]\nenable_confirmations = true\n',1)
          f.write_text(s)
          PY
          supabase start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/invitaciones-cli.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/invitaciones-cli.log"
            exit 1
          }
          supabase status -o env > "$RUNNER_TEMP/invitaciones-cli-env"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          data={}
          for line in Path(os.environ['RUNNER_TEMP']+'/invitaciones-cli-env').read_text().splitlines():
            m=re.match(r'^([A-Z_]+)\s*=\s*"?([^"\n]*)"?$',line.strip())
            if m: data[m[1]]=m[2]
          mapping={'API_URL':'OBI_QA_API_URL','ANON_KEY':'OBI_QA_ANON_KEY','SERVICE_ROLE_KEY':'OBI_QA_SERVICE_KEY'}
          for source in mapping:
            if not data.get(source): raise SystemExit('Credencial temporal no encontrada: '+source)
          if not re.fullmatch(r'http://(127\.0\.0\.1|localhost):\d+/?',data['API_URL']):
            raise SystemExit('Error: refusing remote Supabase URL')
          with open(os.environ['GITHUB_ENV'],'a') as out:
            for source,target in mapping.items():
              if source!='API_URL': print('::add-mask::'+data[source])
              print(target+'='+data[source],file=out)
          print('Supabase efímero local: URL loopback y credenciales aisladas')
          PY
      - name: Crear esquema sintético y aplicar migración NUEVA exclusivamente local
        shell: bash
        run: |
          set -euo pipefail
          db="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^supabase_db_/ {print $1; exit}')"
          test -n "$db"
          psql_local() {
            docker exec -i -e PGPASSWORD=postgres "$db" \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$1"
          }
          psql_local supabase/tests/fixtures/invitaciones_auth_local.sql
          psql_local supabase/migrations/20261022231500_team_invitations_one_time.sql
          docker exec -i -e PGPASSWORD=postgres "$db" \
            psql -X -U postgres -d postgres -c "NOTIFY pgrst, 'reload schema';"
          sleep 3
      - name: Probar usuarios reales locales, JWT, creación, rol y uso único
        run: node scripts/invitaciones-supabase-local-http-check.mjs
      - name: Destruir contenedores y claves locales
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/obi-invitaciones-local" || exit 0
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/invitaciones-cli-env"
