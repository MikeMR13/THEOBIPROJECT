name: Editor fase 0 — PostgreSQL aislado (sin producción)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261030205428_editor_phase0_content_protection_20261030.sql'
      - 'scripts/qa/editor-phase0-*.sql'
      - '.github/workflows/editor-phase0-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-phase0-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: editor_phase0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d editor_phase0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: editor_phase0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ejecutar regresión en PostgreSQL temporal
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo 'psql no disponible'; exit 1; }
          psql -v ON_ERROR_STOP=1 -f scripts/qa/editor-phase0-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030205428_editor_phase0_content_protection_20261030.sql
          # El backfill y los triggers deben poder reejecutarse sin duplicados.
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030205428_editor_phase0_content_protection_20261030.sql
          psql -v ON_ERROR_STOP=1 -f scripts/qa/editor-phase0-assertions.sql
          echo 'Fase 0 validada, sin credenciales ni acceso a Supabase productivo'
