name: Inicio · Resenas anonimas PostgreSQL aislado
on:
  pull_request:
    paths:
      - 'sql/home-feed-anonymous-reviews*.sql'
      - 'scripts/home-anon-reviews-qa-*.sql'
      - '.github/workflows/home-anon-reviews-qa.yml'
  push:
    branches: [fix/home-feed-anonymous-reviews-20261026]
    paths:
      - 'sql/home-feed-anonymous-reviews*.sql'
      - 'scripts/home-anon-reviews-qa-*.sql'
      - '.github/workflows/home-anon-reviews-qa.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qa-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Reproducir fallo, aplicar corrección, verificar y revertir
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/home-anon-reviews-qa-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/home-anon-reviews-qa-before.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/home-feed-anonymous-reviews-20261026.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/home-anon-reviews-qa-after.sql
          psql -X -v ON_ERROR_STOP=1 -c "set role anon; select jsonb_array_length(public.home_feed()->'reviews') as review_count;"
          psql -X -v ON_ERROR_STOP=1 -f sql/home-feed-anonymous-reviews-rollback.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/home-anon-reviews-qa-rollback.sql
