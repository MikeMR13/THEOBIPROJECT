name: Vitrina V2 · capturas del sitio desplegado
on:
  push:
    branches:
      - feat/vitrina-v2-20261028
    paths:
      - .github/workflows/vitrina-preview-capturas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitio-real:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL: https://theobiproject-amcjbn8wk-cronica.vercel.app
    steps:
      - name: Verificar que la vista previa sea accesible sin credenciales
        shell: bash
        run: |
          status=$(curl --max-time 15 --silent --show-error --location --output /tmp/vitrina-preview.html --write-out '%{http_code}' "$PREVIEW_URL/")
          echo "HTTP: $status"
          if [ "$status" != "200" ]; then
            echo "::error::La vista previa está restringida o no disponible; NO es una captura del sitio."
            exit 1
          fi
          if grep -Eiq 'Vercel Authentication|Deployment Protection|Authentication Required|Sign in to Vercel' /tmp/vitrina-preview.html; then
            echo "::error::La respuesta es una página de autenticación, no la web."
            exit 1
          fi
          grep -q 'id="app"' /tmp/vitrina-preview.html || { echo "::error::No está la aplicación real"; exit 1; }
      - name: Verificar render del carrusel real
        shell: bash
        run: |
          CHROME=$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --virtual-time-budget=13000 --window-size=1440,1100 --dump-dom "$PREVIEW_URL/" > /tmp/vitrina-renderizada.html
          if ! grep -q 'class="vt"' /tmp/vitrina-renderizada.html; then
            echo "::error::No se detectó el carrusel Vitrina V2 en la página desplegada. No generar capturas falsas."
            exit 1
          fi
          echo "Vitrina V2 presente en el DOM del despliegue real."
      - name: Capturar el sitio completo en móvil y escritorio
        shell: bash
        run: |
          CHROME=$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)
          mkdir -p capturas-sitio-real
          for w in 390 1440; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --virtual-time-budget=13000 --window-size="$w,1100" --screenshot="capturas-sitio-real/el-obi-vitrina-v2-$w.png" "$PREVIEW_URL/"
            test -s "capturas-sitio-real/el-obi-vitrina-v2-$w.png"
            echo "Captura del sitio real: $w px"
          done
      - name: Guardar capturas reales
        uses: actions/upload-artifact@v4
        with:
          name: vitrina-v2-sitio-real
          path: capturas-sitio-real/*.png
          retention-days: 1
          if-no-files-found: error
