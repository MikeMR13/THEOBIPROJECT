name: Difusion - PostgreSQL QA aislado
on:
  pull_request:
    paths:
      - '.github/workflows/diffusion-isolated-db.yml'
      - 'supabase/migrations/20261025232409_diffusion_phase1_controlled_20261025.sql'
      - 'supabase/migrations/20261025232432_diffusion_discord_manual_controlled_20261025.sql'
      - 'supabase/tests/diffusion_discord_rls.sql'
      - 'supabase/functions/diffusion-discord/**'
      - 'scripts/diffusion-discord-check.mjs'
      - 'supabase/tests/fixtures/diffusion_postgres_fixture.sql'
      - 'supabase/tests/diffusion_phase1_rls.sql'
      - 'scripts/diffusion-phase1-check.mjs'
      - 'supabase/migrations/20261026010751_diffusion_discord_announcements_manual_20261025.sql'
      - 'supabase/tests/diffusion_discord_announcement_rls.sql'
      - 'supabase/migrations/20261026012634_diffusion_discord_cover_by_publication_level_20261025.sql'
      - 'supabase/migrations/20261026021155_diffusion_telegram_manual_phase2c_20261025.sql'
      - 'supabase/tests/diffusion_telegram_rls.sql'
      - 'supabase/migrations/20261026032956_diffusion_telegram_grupos_prueba_20261025.sql'
      - 'supabase/tests/diffusion_telegram_group_ids.sql'
      - 'supabase/functions/diffusion-telegram/**'
      - 'scripts/diffusion-telegram-check.mjs'
      - 'supabase/migrations/20261026045625_diffusion_phase4a_manual_schedule_20261025.sql'
      - 'supabase/tests/diffusion_phase4a_schedule_rls.sql'
  push:
    branches:
      - feat/difusion-hibrida-equipos-autonomos-20261025
    paths:
      - '.github/workflows/diffusion-isolated-db.yml'
      - 'supabase/migrations/20261025232409_diffusion_phase1_controlled_20261025.sql'
      - 'supabase/migrations/20261025232432_diffusion_discord_manual_controlled_20261025.sql'
      - 'supabase/tests/diffusion_discord_rls.sql'
      - 'supabase/functions/diffusion-discord/**'
      - 'scripts/diffusion-discord-check.mjs'
      - 'supabase/tests/fixtures/diffusion_postgres_fixture.sql'
      - 'supabase/tests/diffusion_phase1_rls.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diffusion-postgres-qa
  cancel-in-progress: true

jobs:
  postgres:
    name: Migracion real - RLS A/B - autonomia editorial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: obi_diffusion_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_qa_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d obi_diffusion_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar migracion y pruebas RLS en PostgreSQL efimero
        env:
          PGPASSWORD: ephemeral_qa_only
        run: |
          set -euo pipefail
          psql_qa() {
            docker run --rm --network host \
              -e PGPASSWORD="$PGPASSWORD" \
              -v "$PWD:/work:ro" -w /work \
              postgres:17-alpine \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d obi_diffusion_qa -f "$1"
          }
          echo '1/3 - Esquema sintético Auth, roles y dos equipos ficticios'
          psql_qa supabase/tests/fixtures/diffusion_postgres_fixture.sql
          echo '2/3 - Aplicar la migración ORIGINAL de Difusión'
          psql_qa supabase/migrations/20261025232409_diffusion_phase1_controlled_20261025.sql
          echo '3/3 - Permisos por equipo, Bibliotecario separado, anon y RPC'
          psql_qa supabase/tests/diffusion_phase1_rls.sql
          echo '4/5 - Migración Discord: Vault API simulada solo en QA de PostgreSQL'
          psql_qa supabase/migrations/20261025232432_diffusion_discord_manual_controlled_20261025.sql
          echo '5/5 - Privilegios, conexión y revocación Discord'
          psql_qa supabase/tests/diffusion_discord_rls.sql
          echo '6/6 - Anuncios manuales: migración y visibilidad pública'
          psql_qa supabase/migrations/20261026010751_diffusion_discord_announcements_manual_20261025.sql
          psql_qa supabase/tests/diffusion_discord_announcement_rls.sql
          psql_qa supabase/migrations/20261026012634_diffusion_discord_cover_by_publication_level_20261025.sql
          psql_qa supabase/migrations/20261026021155_diffusion_telegram_manual_phase2c_20261025.sql
          psql_qa supabase/tests/diffusion_telegram_rls.sql
          psql_qa supabase/migrations/20261026032956_diffusion_telegram_grupos_prueba_20261025.sql
          psql_qa supabase/tests/diffusion_telegram_group_ids.sql
          psql_qa supabase/migrations/20261026045625_diffusion_phase4a_manual_schedule_20261025.sql
          psql_qa supabase/tests/diffusion_phase4a_schedule_rls.sql
          echo 'Difusión QA aprobado, sin servicios alojados ni envío de publicaciones'
