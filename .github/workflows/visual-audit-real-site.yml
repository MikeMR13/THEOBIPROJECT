name: Auditoría visual REAL — sitio publicado
on:
  push:
    branches:
      - audit/capturas-reales-sitio-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-real-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  capture:
    name: Chrome · Capturas reales de rutas públicas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUDIT_BASE_URL: https://elobidellector.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar Playwright-core sin descargar navegador ni servicios de pago
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Verificar la sintaxis
        run: node --check scripts/visual-audit-real-site.mjs
      - name: Seleccionar dominio real o despliegue Vercel idéntico
        shell: bash
        run: |
          status=$(curl -L -sS --max-time 18 -o /tmp/audit-home.html -w "%{http_code}" "$AUDIT_BASE_URL/" || true)
          echo "Acceso al dominio Cloudflare: HTTP $status"
          if [ "$status" = "200" ] && ! grep -Eiq 'Just a moment|cf-chl|challenge-platform|Attention Required|Verify you are human' /tmp/audit-home.html; then
            echo "Capturas sobre dominio principal"
          else
            echo "::warning::El dominio principal no permite la auditoría automatizada (HTTP $status). Se verifica en Vercel el mismo commit de producción, sin eludir Cloudflare."
            echo "AUDIT_BASE_URL=https://theobiproject-c7z8fiflv-cronica.vercel.app" >> "$GITHUB_ENV"
          fi
      - name: Inspeccionar la web publicada en Chromium (móvil y escritorio)
        run: node scripts/visual-audit-real-site.mjs
      - name: Guardar capturas de producción e informe (7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-visual-real-PC-movil
          path: qa-capturas/auditoria-real/
          retention-days: 7
          if-no-files-found: warn
