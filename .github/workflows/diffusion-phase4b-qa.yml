name: Difusión 4B · QA aislada y sin envíos
on:
  pull_request:
    paths:
      - 'sql/diffusion-4b-*'
      - 'supabase/functions/diffusion-dispatch/**'
      - 'scripts/diffusion-dispatch-check.mjs'
      - 'supabase/tests/diffusion_phase4b_dispatch_rls.sql'
      - 'supabase/tests/fixtures/diffusion_phase4b_pgnet.sql'
      - '.github/workflows/diffusion-phase4b-qa.yml'
      - 'src/diffusion-panel.js'
      - 'supabase/migrations/20261026223000_diffusion_draft_presentation.sql'
      - 'supabase/tests/diffusion_draft_presentation_rls.sql'
      - 'sql/diffusion-4c-*'
      - 'sql/diffusion-prelaunch-rule-candidate.sql'
      - 'sql/diffusion-multichannel-rules-candidate.sql'
      - 'supabase/tests/diffusion_multichannel_rules_rls.sql'
      - 'sql/diffusion-prelaunch-review-approve-candidate.sql'
      - 'supabase/tests/diffusion_prelaunch_review_rls.sql'
      - 'supabase/tests/diffusion_prelaunch_announced_rls.sql'
      - 'supabase/tests/fixtures/diffusion_prelaunch_pg17.sql'
      - 'supabase/tests/diffusion_phase4c_rules_rls.sql'
  push:
    branches: [feat/difusion-fase4b-despacho-programado-20261026, feat/difusion-reglas-activacion-20261026, feat/difusion-preestreno-nueva-obra-anunciada-20261026, feat/difusion-reglas-multicanal-20261026]
permissions:
  contents: read
jobs:
  sql-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: obi_diffusion_4b
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d obi_diffusion_4b"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SQL real, dos equipos simulados, deduplicación y tickets de un solo uso
        env:
          PGPASSWORD: qa-only
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
              -v "$PWD:/work:ro" -w /work postgres:17-alpine \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d obi_diffusion_4b -f "$1"
          }
          qa supabase/tests/fixtures/diffusion_postgres_fixture.sql
          qa supabase/migrations/20261025232409_diffusion_phase1_controlled_20261025.sql
          qa supabase/tests/diffusion_phase1_rls.sql
          qa supabase/migrations/20261025232432_diffusion_discord_manual_controlled_20261025.sql
          qa supabase/tests/diffusion_discord_rls.sql
          qa supabase/migrations/20261026010751_diffusion_discord_announcements_manual_20261025.sql
          qa supabase/tests/diffusion_discord_announcement_rls.sql
          qa supabase/migrations/20261026012634_diffusion_discord_cover_by_publication_level_20261025.sql
          qa supabase/migrations/20261026021155_diffusion_telegram_manual_phase2c_20261025.sql
          qa supabase/tests/diffusion_telegram_rls.sql
          qa supabase/migrations/20261026032956_diffusion_telegram_grupos_prueba_20261025.sql
          qa supabase/tests/diffusion_telegram_group_ids.sql
          qa supabase/migrations/20261026045625_diffusion_phase4a_manual_schedule_20261025.sql
          qa supabase/tests/diffusion_phase4a_schedule_rls.sql
          qa supabase/tests/fixtures/diffusion_phase4b_pgnet.sql
          qa sql/diffusion-4b-dispatch-candidate.sql
          qa supabase/tests/diffusion_phase4b_dispatch_rls.sql
          qa sql/diffusion-4c-event-rules-candidate.sql
          qa supabase/tests/diffusion_phase4c_rules_rls.sql
          qa supabase/tests/fixtures/diffusion_prelaunch_pg17.sql
          qa sql/diffusion-prelaunch-rule-candidate.sql
          qa sql/diffusion-prelaunch-review-approve-candidate.sql
          qa supabase/tests/diffusion_prelaunch_announced_rls.sql
          qa supabase/tests/diffusion_prelaunch_review_rls.sql
          qa sql/diffusion-multichannel-rules-candidate.sql
          qa supabase/tests/diffusion_multichannel_rules_rls.sql
          echo 'Borradores con preferencias por equipo: migración + privilegios'
          qa supabase/migrations/20261026223000_diffusion_draft_presentation.sql
          qa supabase/tests/diffusion_draft_presentation_rls.sql
      - name: Edge Function simulada sin red ni tokens
        run: |
          node --check supabase/functions/diffusion-dispatch/handler.mjs
          node scripts/diffusion-dispatch-check.mjs
