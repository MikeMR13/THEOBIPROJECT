name: Inicio editorial de lectura
on:
  pull_request:
    paths:
      - 'src/section-types.js'
      - 'src/chapter-title-display.js'
      - 'src/reading-start.js'
      - 'src/studio.js'
      - 'src/ui.js'
      - 'scripts/reading-start-check.mjs'
      - 'supabase/migrations/20261031000000_editorial_reading_start.sql'
      - '.github/workflows/reading-start-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-inicio-lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas editoriales sin servicios externos
        run: |
          node --check src/section-types.js
          node --check src/chapter-title-display.js
          node --check src/reading-start.js
          node --check src/studio.js
          node --check src/ui.js
          node scripts/reading-start-check.mjs
