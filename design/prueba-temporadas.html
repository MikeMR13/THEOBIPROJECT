<main id="app"><section id="hero"><span class="mono">NUEVO · CAP. 58</span><h1>¿Heroína, santa? ¡No, soy una sirvienta!</h1><p><a class="btn" href="#">Seguir leyendo</a></p></section>

<div class="ctl">PRUEBA LOCAL <label>Temporada <select id="k"></select></label><label>Página <select id="kind"><option value="home">Inicio</option><option value="catalog">Catálogo</option><option value="team">Página de equipo</option><option value="reader">Lector</option></select></label></div>
<script type="module">
import * as PS from '../src/season.js?v=1';
const k = document.getElementById('k'), kind = document.getElementById('kind');
Object.entries(PS.SEASONS).forEach(([v, s]) => k.insertAdjacentHTML('beforeend', '<option value="' + v + '">' + s.l + '</option>'));
k.value = 'halloween';
const go = () => PS.apply(kind.value, { key: k.value });
k.onchange = go; kind.onchange = go; addEventListener('obi-season', () => { localStorage.removeItem('obi-season'); setTimeout(go, 400); });
go(); window.__ps = PS;
</script></body></html>
