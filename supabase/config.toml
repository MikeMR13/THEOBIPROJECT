# Valores de Auth para El Obi del Lector (aplícalos en el panel o con `supabase config push`)
[auth]
# Dominio canónico. Sin comodines generales *.vercel.app para no permitir
# redirecciones OAuth a proyectos ajenos. Las previews usan pruebas locales.
site_url = "https://elobidellector.com"
additional_redirect_urls = ["https://elobidellector.com/**", "https://www.elobidellector.com/**", "https://theobiproject.vercel.app/**", "https://theobiproject-cronica.vercel.app/**", "http://localhost:3000/**"]

minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirma tu cuenta en El Obi del Lector"
content_path = "./supabase/templates/confirmation.html"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "biblioteca@TU-DOMINIO"
sender_name = "El Obi del Lector"
